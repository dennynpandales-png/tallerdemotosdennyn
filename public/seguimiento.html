<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#080b11">
    <title>Seguimiento de servicio | HIDEP-SOFT-SG - Taller de Motos</title>
    <link rel="icon" href="/seguimiento/icon.png">
    <link rel="stylesheet" href="/seguimiento/tema-taller.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-size: 1rem; line-height: 1.55; overflow-wrap: anywhere; }
        main { max-width: 52rem; margin: auto; padding: clamp(1rem, 5vw, 3rem); }
        header { padding: 1.5rem; border-radius: 1rem 1rem 0 0; }
        header strong { display: block; margin-top: .75rem; color: var(--sg-accent); }
        h1, h2 { line-height: 1.2; }
        h1 { margin: .4rem 0 0; }
        form, section { padding: 1.4rem; }
        section { margin-top: 1rem; border-radius: .75rem; }
        label { display: block; font-weight: 650; margin: .5rem 0 .25rem; }
        input, button { font: inherit; min-height: 2.75rem; padding: .45rem .75rem; border-radius: .5rem; }
        input { width: 100%; border: 1px solid var(--sg-border); background: var(--sg-input); color: var(--sg-text); }
        input:focus-visible, button:focus-visible { outline: 2px solid var(--sg-accent); outline-offset: 2px; }
        button { background: var(--sg-accent); color: #111827; border: 0; margin-top: 1rem; cursor: pointer; font-weight: 700; }
        button:disabled { opacity: .6; cursor: wait; }
        #mensaje:empty { display: none; }
        #estado { color: var(--sg-accent); font-weight: 750; }
        li { margin-bottom: .85rem; overflow-wrap: anywhere; }
        time { display: block; color: var(--sg-muted); font-size: .9rem; }
        #fotos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 1rem; }
        figure { margin: 0; overflow-wrap: anywhere; }
        figure img { display: block; width: 100%; height: 12rem; object-fit: contain; background: var(--sg-input); border-radius: .5rem; }
    </style>
    <script defer src="/seguimiento/identidad.js"></script>
    <script defer src="/seguimiento/portal.js"></script>
</head>
<body class="fondo-taller">
    <main>
        <header class="panel-taller">
            <img class="logo-taller" src="/seguimiento/icon.png" alt="" width="64" height="64">
            <strong>HIDEP-SOFT-SG - Taller de Motos</strong>
            <h1>Seguimiento de tu motocicleta</h1>
        </header>
        <form id="consulta" class="panel-taller">
            <label for="identificador">Número de orden o placa</label>
            <input id="identificador" required maxlength="24" autocomplete="off" placeholder="Ej. 128 o ABC12D">
            <div id="codigoCampo">
                <label for="codigo">Código de seguimiento</label>
                <input id="codigo" required maxlength="64" autocomplete="off" autocapitalize="none" spellcheck="false">
            </div>
            <button type="submit">Consultar orden</button>
            <p id="mensaje" role="status"></p>
        </form>
        <div id="resultado" hidden>
            <section class="panel-taller">
                <h2 id="orden"></h2>
                <p id="estado"></p>
            </section>
            <section class="panel-taller">
                <h2>Historial del servicio</h2>
                <ol id="bitacora"></ol>
            </section>
            <section class="panel-taller">
                <h2>Evidencias fotográficas</h2>
                <div id="fotos"></div>
            </section>
        </div>
    </main>
</body>
</html>
